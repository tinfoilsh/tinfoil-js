name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          # Disable caching in release flows to avoid cache poisoning supply chain attacks
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # A prerelease tag (v2.0.0-rc.1) is published under the `next` dist-tag so that `npm install tinfoil` keeps resolving to the latest stable release.
      - name: Choose the npm dist-tag
        id: dist
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @tinfoilsh/verifier to npm
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"
        working-directory: packages/verifier

      - name: Publish tinfoil to npm
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"
        working-directory: packages/tinfoil

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.dist.outputs.prerelease }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease="$PRERELEASE"
