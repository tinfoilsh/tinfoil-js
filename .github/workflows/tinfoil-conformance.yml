name: Tinfoil Conformance

# Runs the cross-SDK Tinfoil conformance suite
# (https://github.com/tinfoilsh/tinfoil-conformance) against this SDK's
# `@tinfoilsh/conformance` binary. Distinct from the test/lint/audit
# workflows above, which exercise the consumer-facing verifier API.

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  conformance:
    name: Tinfoil Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build verifier
        # The conformance package depends on @tinfoilsh/verifier at runtime,
        # so the verifier must be built before the conformance package.
        run: npm run build -w @tinfoilsh/verifier

      - name: Build conformance binary
        run: npm run build -w @tinfoilsh/conformance

      - name: Checkout tinfoil-conformance suite
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tinfoilsh/tinfoil-conformance
          ref: main
          path: tinfoil-conformance
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tinfoil-conformance/harness/pyproject.toml

      - name: Install harness
        run: pip install ./tinfoil-conformance/harness

      - name: Show SDK capabilities
        run: |
          tinfoil-conformance capabilities \
            --sdk "tinfoil-js=node ${{ github.workspace }}/packages/conformance/dist/cli.js"

      - name: Run conformance vectors
        run: |
          tinfoil-conformance run \
            --sdk "tinfoil-js=node ${{ github.workspace }}/packages/conformance/dist/cli.js" \
            --vectors tinfoil-conformance/vectors/sigstore

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinfoil-conformance-results
          path: results/

      - name: Append summary
        if: always()
        run: |
          if [ -f results/latest/results.md ]; then
            cat results/latest/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
