name: v3 conformance

# Runs the shared v3 conformance suite against this SDK's adapter, twice:
# through the Node CLI (the wire adapter) and inside real Chromium (the same
# engine-neutral verifier). Fixtures come from tinfoilsh/tinfoil-conformance.

on:
  push:
    branches: [main, feat/v3-verifier]
    paths: ["packages/verifier/**", "packages/conformance/**", "package-lock.json", ".github/workflows/v3-conformance.yml"]
  pull_request:
    paths: ["packages/verifier/**", "packages/conformance/**", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check out the shared conformance suite
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tinfoilsh/tinfoil-conformance
          path: tinfoil-conformance
          token: ${{ secrets.CONFORMANCE_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build && npm run build -w @tinfoil/conformance
      - name: Run the suite through the Node adapter
        run: |
          python3 tinfoil-conformance/tools/run_adapter.py \
            --adapter "node packages/conformance/dist/cli.js"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the suite in Chromium
        env:
          TINFOIL_CONFORMANCE_VECTORS: ${{ github.workspace }}/tinfoil-conformance/vectors/v3
        run: npm run test:browser:conformance -w packages/verifier
